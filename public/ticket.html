<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Entrada QR | SUNSET 2026 - Ntra. Sra. del Valle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="dashboard-wrap" style="max-width: 460px; margin-top: 24px;">
    <div class="panel-card" id="ticketCard" style="text-align: center; padding: 28px 22px;">
      <div style="font-size: 0.78rem; font-weight: 800; color: var(--sunset-gold); text-transform: uppercase; letter-spacing: 1px;">
        Instituto Parroquia Nuestra Señora del Valle
      </div>
      <h1 style="font-size: 2rem; font-weight: 900; margin: 6px 0 4px;">🌅 SUNSET 2026</h1>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 18px;">
        Viernes 27 de Noviembre • 19:30 a 23:00 hs • Córdoba
      </p>

      <div id="ticketContent">
        <p style="padding: 20px; color: var(--text-muted);">Cargando tu entrada QR...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const container = document.getElementById('ticketContent');

      if (!token) {
        container.innerHTML = '<div class="alert alert-error">Código de entrada no especificado.</div>';
        return;
      }

      try {
        const res = await fetch('/api/tickets/' + encodeURIComponent(token));
        const data = await res.json();
        if (!res.ok) {
          container.innerHTML = `<div class="alert alert-error">${data.error || 'Entrada no encontrada.'}</div>`;
          return;
        }

        const statusHtml = data.checked_in
          ? `<div class="badge badge-checkedin" style="margin-bottom:12px;">✅ Entrada ya utilizada en puerta (${data.checked_in_at})</div>`
          : `<div class="badge badge-confirmed" style="margin-bottom:12px;">🎟️ Entrada Oficial Habilitada (1 solo uso)</div>`;

        container.innerHTML = `
          ${statusHtml}
          <div style="background: #fff; padding: 18px; border-radius: 18px; display: inline-block; margin-bottom: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.45);">
            <img src="${data.qr_data_url}" alt="Código QR" style="width: 240px; height: 240px; display: block;" />
            <div style="font-family: monospace; color: #111; font-weight: 800; font-size: 0.85rem; margin-top: 8px;">${data.qr_token}</div>
          </div>

          <div style="background: rgba(255,255,255,0.07); border-radius: 14px; padding: 16px; text-align: left; font-size: 0.94rem; line-height: 1.7; margin-bottom: 16px;">
            <div>👤 <strong>Alumno/a:</strong> ${data.first_name} ${data.last_name}</div>
            <div>🪪 <strong>DNI:</strong> ${data.dni}</div>
            <div>🎓 <strong>Curso:</strong> ${data.course} "${data.division}"</div>
            <div>📍 <strong>Lugar:</strong> ${data.event.venue_name}</div>
          </div>

          <a href="${data.qr_data_url}" download="Entrada_Sunset_${data.dni}.png" class="btn btn-primary" style="width: 100%;">
            ⬇️ Guardar Imagen QR en mi Celular
          </a>
        `;
      } catch (e) {
        container.innerHTML = '<div class="alert alert-error">Error al cargar la entrada.</div>';
      }
    });
  </script>
</body>
</html>
